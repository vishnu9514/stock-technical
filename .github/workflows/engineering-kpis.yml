name: Engineering KPI collection

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest fastapi sqlalchemy pandas numpy requests
      - name: Run tests and save JUnit results
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m pytest tests/test_kpi_*.py tests/test_macd_data_quality.py tests/test_nse_bhavcopy.py --junitxml=reports/junit.xml
      - name: Calculate reporting window
        id: window
        run: |
          echo "start=$(python -c 'from datetime import datetime, timedelta, timezone; today=datetime.now(timezone.utc).date(); print((today - timedelta(days=today.weekday()+7)).isoformat())')" >> "$GITHUB_OUTPUT"
          echo "end=$(python -c 'from datetime import datetime, timedelta, timezone; today=datetime.now(timezone.utc).date(); print((today - timedelta(days=today.weekday())).isoformat())')" >> "$GITHUB_OUTPUT"
      - name: Collect GitHub and pytest measurements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KPI_API_URL: ${{ secrets.KPI_API_URL }}
          KPI_API_KEY: ${{ secrets.KPI_API_KEY }}
          KPI_PROJECT_ID: ${{ vars.KPI_PROJECT_ID }}
        run: |
          if [ -z "$KPI_API_URL" ]; then
            echo "Configure the KPI_API_URL repository secret before enabling collection." >&2
            exit 1
          fi
          PROJECT="${KPI_PROJECT_ID:-$GITHUB_REPOSITORY}"
          python -m kpi.collect \
            --project "$PROJECT" \
            --repository "$GITHUB_REPOSITORY" \
            --pytest-xml reports/junit.xml \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --csv reports/kpi_measurements.csv \
            --api "$KPI_API_URL"
      - name: Save KPI output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-kpi-output
          path: |
            reports/kpi_measurements.csv
            reports/junit.xml
          if-no-files-found: warn
